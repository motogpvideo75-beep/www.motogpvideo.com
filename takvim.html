function getStatus(dateStr) {
  const now = new Date();
  const race = new Date(dateStr + 'T23:59:59');
  const raceStart = new Date(dateStr + 'T00:00:00');
  if (race < now) return 'past';
  const diff = raceStart - now;
  if (diff < 7 * 24 * 60 * 60 * 1000) return 'next';
  return 'upcoming';
}

function formatDate(dateStr) {
  const d = new Date(dateStr + 'T12:00:00');
  return d.toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' });
}

function getCountdown(dateStr, timeStr) {
  const [h, m] = timeStr.split(':');
  const target = new Date(dateStr + 'T' + h + ':' + m + ':00');
  target.setHours(target.getHours());
  const diff = target - new Date();
  if (diff <= 0) return null;
  const days = Math.floor(diff / 86400000);
  const hours = Math.floor((diff % 86400000) / 3600000);
  const mins = Math.floor((diff % 3600000) / 60000);
  if (days > 0) return days + ' gün ' + hours + ' saat';
  if (hours > 0) return hours + ' saat ' + mins + ' dk';
  return mins + ' dakika';
}

function renderNextRace(race) {
  const cd = getCountdown(race.date, race.raceTime);
  if (!cd) return;
  document.getElementById('next-race-box').innerHTML = `
    <div class="next-race">
      <div>
        <div class="label">⏱️ Sıradaki Yarış</div>
        <div class="name">${race.country} ${race.name}</div>
        <div style="font-size:.85rem;opacity:.8;margin:2px 0">${race.circuit} · ${formatDate(race.date)} · Yarış ${race.raceTime} (TR)</div>
        <div class="sessions">
          ${race.sessions.map(s=>`<div class="session"><b>${s.n}:</b> ${s.t}</div>`).join('')}
        </div>
      </div>
      <div style="text-align:center;flex-shrink:0">
        <div class="label">Kalan Süre</div>
        <div class="countdown">${cd}</div>
      </div>
    </div>`;
}

function renderRaces(races) {
  const container = document.getElementById('races-container');
  if (!races.length) { container.innerHTML = '<div class="loading">Gösterilecek yarış yok.</div>'; return; }
  container.innerHTML = races.map(race => {
    const status = getStatus(race.date);
    const statusLabel = {past:'Tamamlandı',next:'Sıradaki',upcoming:'Yaklaşan'}[status];
    const statusClass = {past:'status-past',next:'status-next',upcoming:'status-upcoming'}[status];
    if (currentFilter === 'upcoming' && status === 'past') return '';
    if (currentFilter === 'past' && status !== 'past') return '';
    return `
    <div class="race-card ${status}">
      <div class="round-badge">${race.round}</div>
      <div class="race-info">
        <div class="race-name">${race.country} ${race.name} <span class="status-badge ${statusClass}">${statusLabel}</span></div>
        <div class="race-circuit">🏁 ${race.circuit}</div>
        <div class="sessions-row">
          ${race.sessions.map(s=>`<div class="session-pill">${s.n}: <span>${s.t}</span></div>`).join('')}
        </div>
      </div>
      <div class="race-dates">
        <div class="race-date">${formatDate(race.date)}</div>
        <div class="race-time">🏁 Yarış: ${race.raceTime} (TR)</div>
      </div>
    </div>`;
  }).join('');
}

function filterRaces(filter, btn) {
  currentFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderRaces(allRaces);
}

async function loadRaces() {
  try {
    // MotoGP public API dene
    const seasonsRes = await fetch('https://api.motogp.pulselive.com/motogp/v1/results/seasons');
    if (!seasonsRes.ok) throw new Error('API yanıt vermedi');
    const seasons = await seasonsRes.json();
    const season2026 = seasons.find(s => s.year === 2026);
    if (!season2026) throw new Error('2026 sezonu bulunamadı');
    const eventsRes = await fetch(`https://api.motogp.pulselive.com/motogp/v1/results/events?seasonUuid=${season2026.id}&isFinished=false`);
    const events = await eventsRes.json();
    // API verisini dönüştür
    allRaces = events.events.map((e,i) => ({
      round: i+1,
      name: e.name,
      circuit: e.circuit?.name || '',
      country: '',
      date: e.date_start?.split('T')[0] || '',
      raceTime: '14:00',
      sessions: []
    }));
  } catch(e) {
    // Yedek veriyi kullan
    allRaces = FALLBACK_RACES;
  }

  // Sıradaki yarışı bul ve göster
  const nextRace = allRaces.find(r => getStatus(r.date) === 'next') ||
                   allRaces.find(r => getStatus(r.date) === 'upcoming');
  if (nextRace) renderNextRace(nextRace);

  renderRaces(allRaces);
  injectEventSchema(allRaces);
}

// --- Pist -> adres eslestirme (SportsEvent location.address: GSC "address" uyarisi icin) ---
var MGV_CIRCUIT_ADDR = [
  {k:["buriram","chang"], l:"Buriram", c:"TH"},
  {k:["goi"], l:"Goiânia", c:"BR"},
  {k:["termas","rio hondo","río hondo"], l:"Termas de Río Hondo", c:"AR"},
  {k:["lusail","losail"], l:"Lusail", c:"QA"},
  {k:["jerez"], l:"Jerez de la Frontera", c:"ES"},
  {k:["le mans"], l:"Le Mans", c:"FR"},
  {k:["catalunya","barcelona","montmel"], l:"Montmeló", c:"ES"},
  {k:["balaton"], l:"Balatonfőkajár", c:"HU"},
  {k:["brno"], l:"Brno", c:"CZ"},
  {k:["assen"], l:"Assen", c:"NL"},
  {k:["sachsenring"], l:"Hohenstein-Ernstthal", c:"DE"},
  {k:["silverstone"], l:"Silverstone", c:"GB"},
  {k:["red bull ring","spielberg"], l:"Spielberg", c:"AT"},
  {k:["aragon","aragón","motorland"], l:"Alcañiz", c:"ES"},
  {k:["misano"], l:"Misano Adriatico", c:"IT"},
  {k:["motegi"], l:"Motegi", c:"JP"},
  {k:["mandalika"], l:"Kuta", c:"ID"},
  {k:["phillip island"], l:"Phillip Island", c:"AU"},
  {k:["sepang"], l:"Sepang", c:"MY"},
  {k:["algarve","portim"], l:"Portimão", c:"PT"},
  {k:["ricardo tormo","valencia","cheste"], l:"Cheste", c:"ES"}
];
function mgvCircuitAddress(circuit){
  if(!circuit) return null;
  var s = String(circuit).toLowerCase();
  for(var i=0;i<MGV_CIRCUIT_ADDR.length;i++){
    var rec = MGV_CIRCUIT_ADDR[i];
    for(var j=0;j<rec.k.length;j++){
      if(s.indexOf(rec.k[j])!==-1){
        return {"@type":"PostalAddress","addressLocality":rec.l,"addressCountry":rec.c};
      }
    }
  }
  return null;
}
// --- SportsEvent yapilandirilmis veri (GSC: location + startDate zorunlu alanlari) ---
function injectEventSchema(races){
  try{
    if(!races || !races.length) return;
    const IMG = "https://www.motogpvideo.com/banner.png";
    const items = races
      .filter(r => r && r.name && r.date && r.circuit)
      .map(r => {
        const t = (r.raceTime && /^\d{2}:\d{2}$/.test(r.raceTime)) ? r.raceTime : "14:00";
        return {
          "@context": "https://schema.org",
          "@type": "SportsEvent",
          "name": /20\d{2}/.test(r.name) ? r.name : (r.name + " 2026"),
          "sport": "MotoGP",
          "startDate": r.date + "T" + t + ":00+03:00",
          "endDate": r.date + "T23:59:00+03:00",
          "eventStatus": "https://schema.org/EventScheduled",
          "eventAttendanceMode": "https://schema.org/OfflineEventAttendanceMode",
          "image": [IMG],
          "url": "https://www.motogpvideo.com/takvim.html",
          "location": (function(){ var loc={ "@type": "Place", "name": r.circuit }; var a=mgvCircuitAddress(r.circuit); if(a) loc.address=a; return loc; })(),
          "organizer": { "@type": "Organization", "name": "MotoGP", "url": "https://www.motogp.com" },
          "performer": { "@type": "PerformingGroup", "name": "MotoGP World Championship Riders" },
          "offers": { "@type": "Offer", "url": "https://tickets.motogp.com/", "availability": "https://schema.org/InStock", "priceCurrency": "EUR", "validFrom": "2026-01-15" }
        };
      });
    if(!items.length) return;
    let el = document.getElementById("events-jsonld");
    if(!el){
      el = document.createElement("script");
      el.type = "application/ld+json";
      el.id = "events-jsonld";
      document.head.appendChild(el);
    }
    el.textContent = JSON.stringify(items);
  }catch(err){ /* sema enjeksiyonu basarisiz olsa bile sayfa calismaya devam eder */ }
}

loadRaces();

// Her dakika geri sayımı güncelle
setInterval(() => {
  const nextRace = allRaces.find(r => getStatus(r.date) === 'next') ||
                   allRaces.find(r => getStatus(r.date) === 'upcoming');
  if (nextRace) renderNextRace(nextRace);
}, 60000);
