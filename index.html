<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motorsports Live Hub</title>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-JVZGRCSV8B"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-JVZGRCSV8B');
        const data = {
            tr: { title: "MOTOR SPORLARI CANLI MERKEZİ", label: "SON DAKİKA", news: "• Yarış heyecanı burada! Türkiye'nin merkezi.", pilots: "Türkiye: Kenan Sofuoğlu, Toprak Razgatlıoğlu" },
            en: { title: "MOTORSPORTS LIVE HUB", label: "BREAKING", news: "• Race weekend excitement! Welcome to the global hub.", pilots: "Global Icons: Fabio Quartararo, Jack Miller" },
            it: { title: "HUB LIVE MOTORSPORT", label: "ULTIM'ORA", news: "• Emozione pura! Benvenuti nella casa dei campioni.", pilots: "Italia: Francesco Bagnaia, Enea Bastianini" },
            es: { title: "CENTRO DE MOTORSPORTS", label: "ÚLTIMA HORA", news: "• ¡Bienvenidos! Vive la pasión de las carreras con nosotros.", pilots: "España: Marc Márquez, Jorge Martín" },
            fr: { title: "CENTRE LIVE SPORTS", label: "DERNIÈRE MINUTE", news: "• L'excitation du week-end de course commence ici.", pilots: "France: Johann Zarco, Fabio Quartararo" },
            de: { title: "MOTORSPORT LIVE-ZENTRUM", label: "EILMELDUNG", news: "• Die Rennaction beginnt hier.", pilots: "Deutschland: Stefan Bradl" }
        };
        function switchLang(lang) {
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('main-title').innerText = data[lang].title;
            document.getElementById('ticker-label').innerText = data[lang].label;
            document.getElementById('ticker-news').innerText = data[lang].news;
            document.getElementById('pilot-info').innerText = data[lang].pilots;
        }
    </script>
    <style>
        :root { --bg: #0a0f18; --card: #141f32; --accent: #ff2a4b; --text: #ffffff; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; text-align: center; padding: 20px; }
        .lang-switcher { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .lang-btn { background: var(--card); border: 1px solid #2a3a5a; color: white; padding: 8px 15px; border-radius: 5px; cursor: pointer; }
        .lang-btn.active { border-color: var(--accent); background: var(--accent); }
        .ticker-wrapper { max-width: 800px; margin: 20px auto; background: var(--card); border: 1px solid #2a3a5a; border-radius: 8px; display: flex; align-items: center; overflow: hidden; height: 45px; }
        .ticker-title { background: var(--accent); padding: 0 15px; height: 100%; display: flex; align-items: center; font-weight: bold; font-size: 0.8rem; }
        .ticker-text { padding-left: 15px; font-size: 0.9rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; max-width: 1000px; margin: 0 auto; }
        .card { background: var(--card); padding: 20px; border-radius: 10px; border: 1px solid #2a3a5a; text-decoration: none; color: white; }
        #pilot-info { margin-top: 30px; color: #888; font-style: italic; }
    </style>
</head> 
    <body>
    <div class="lang-switcher">
        <button class="lang-btn active" onclick="switchLang('tr')">🇹🇷</button>
        <button class="lang-btn" onclick="switchLang('en')">🇬🇧</button>
        <button class="lang-btn" onclick="switchLang('it')">🇮🇹</button>
        <button class="lang-btn" onclick="switchLang('es')">🇪🇸</button>
        <button class="lang-btn" onclick="switchLang('fr')">🇫🇷</button>
        <button class="lang-btn" onclick="switchLang('de')">🇩🇪</button>
    </div>

    <h1 id="main-title">MOTOR SPORLARI CANLI MERKEZİ</h1>

    <div class="ticker-wrapper">
        <div class="ticker-title" id="ticker-label">SON DAKİKA</div>
        <div class="ticker-text" id="ticker-news">• Yarış heyecanı burada! Türkiye'nin merkezi.</div>
    </div>

    <div class="grid">
        <a href="https://www.youtube.com/@motogp/streams" target="_blank" class="card"><h3>MotoGP</h3></a>
        <a href="https://www.youtube.com/@Formula1/streams" target="_blank" class="card"><h3>Formula 1</h3></a>
        <a href="https://www.redbull.com/int-en/tv/" target="_blank" class="card"><h3>Red Bull TV</h3></a>
    </div>

    <p id="pilot-info">Türkiye: Kenan Sofuoğlu, Toprak Razgatlıoğlu</p>

    <footer>Bu site resmi bir yayın kuruluşu değildir.</footer>
</body>
</html>
