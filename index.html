<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motor Sporları Canlı Merkezi | Live Motorsports Hub</title>
    <style>
        :root { --bg: #0a0f18; --card: #141f32; --accent: #ff2a4b; --text: #ffffff; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; text-align: center; padding: 20px; }
        .hero h1 { font-size: 2rem; text-transform: uppercase; margin-bottom: 5px; }
        .hero p { color: #8a99ad; margin-bottom: 30px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; max-width: 1200px; margin: 0 auto; }
        .card { background: var(--card); padding: 15px; border-radius: 10px; text-decoration: none; color: white; border: 1px solid #2a3a5a; transition: 0.3s; }
        .card:hover { border-color: var(--accent); transform: scale(1.02); }
        .btn-small { display: block; background: var(--accent); padding: 8px; border-radius: 5px; margin-top: 10px; font-weight: bold; font-size: 0.8rem; }
    </style>
</head>
<body>

<div class="hero">
    <h1>MOTOR SPORLARI MERKEZİ</h1>
    <p>TR | EN - Kesintisiz Yayın ve Resmi Kanallar</p>
</div>

<div class="grid">
    <!-- Temel Yayıncılar -->
    <a href="https://www.youtube.com/@motogp" class="card"><h3>MotoGP</h3><div class="btn-small">İZLE</div></a>
    <a href="https://www.redbull.com/int-en/live" class="card"><h3>Red Bull TV</h3><div class="btn-small">İZLE</div></a>
    <a href="https://www.eurosport.com" class="card"><h3>Eurosport 1-2-3</h3><div class="btn-small">İZLE</div></a>
    <a href="https://www.ssportplus.com" class="card"><h3>S Sport</h3><div class="btn-small">İZLE</div></a>
    <a href="https://www.tntsports.co.uk" class="card"><h3>TNT Sports</h3><div class="btn-small">İZLE</div></a>
    <a href="https://www.youtube.com/@F1" class="card"><h3>Formula 1</h3><div class="btn-small">İZLE</div></a>
</div>

</body>
</html>
