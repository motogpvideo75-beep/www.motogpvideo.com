<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motor Sporları Canlı Merkezi</title>
    <style>
        :root { --bg: #0a0f18; --card: #141f32; --accent: #ff2a4b; --text: #ffffff; --muted: #8a99ad; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; min-height: 100vh; justify-content: center; align-items: center; padding: 20px; }
        header { text-align: center; margin-bottom: 50px; }
        h1 { font-size: 2.5rem; text-transform: uppercase; letter-spacing: 3px; margin-bottom: 10px; }
        h1 span { color: var(--accent); }
        header p { color: var(--muted); }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; width: 100%; max-width: 900px; }
        .card { background: var(--card); border-radius: 15px; padding: 40px; text-align: center; border: 2px solid transparent; transition: 0.3s; text-decoration: none; color: white; display: flex; flex-direction: column; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .card:hover { border-color: var(--accent); transform: translateY(-10px); box-shadow: 0 15px 40px rgba(255, 42, 75, 0.2); }
        .icon { font-size: 50px; margin-bottom: 20px; }
        .card h2 { font-size: 1.8rem; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px; }
        .card p { color: var(--muted); margin-bottom: 20px; }
        .btn { background: var(--accent); color: white; padding: 12px 30px; border-radius: 50px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; font-size: 0.9rem; transition: 0.2s; }
        .card:hover .btn { background: #fff; color: #000; }
        .footer { margin-top: 60px; color: #384357; font-size: 0.9rem; letter-spacing: 1px; }
    </style>
</head>
<body>

<header>
    <h1>CANLI <span>MOTOR SPORLARI</span> MERKEZİ</h1>
    <p>Resmi Kanallara ve En Güncel Yayınlara Engelsiz Doğrudan Erişim</p>
</header>

<div class="grid">
    <a href="https://www.youtube.com/@motogp/streams" target="_blank" class="card">
        <div class="icon">🏁</div>
        <h2>MotoGP</h2>
        <p>Canlı Yayınlar, Yarış Özetleri ve Özel İçerikler</p>
        <div class="btn">YAYINI AÇ</div>
    </a>

    <a href="https://www.youtube.com/@worldsbk/streams" target="_blank" class="card">
        <div class="icon">🏍️</div>
        <h2>WorldSBK</h2>
        <p>Canlı Yayınlar, Hafta Sonu Özetleri ve Padoktan Haberler</p>
        <div class="btn">YAYINI AÇ</div>
    </a>
</div>

<div class="footer">
    © 2026 MotoGP Video Hub - Kesintisiz Hız Portalı
</div>

</body>
</html>
