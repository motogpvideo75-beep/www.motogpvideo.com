<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motor Sporları Canlı Merkezi</title>
    <style>
        :root { 
            --bg: #0a0f18; 
            --card: #141f32; 
            --accent: #ff2a4b; 
            --text: #ffffff; 
            --muted: #8a99ad;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 20px; }
        header { text-align: center; margin-bottom: 40px; padding: 20px 0; border-bottom: 2px solid var(--card); }
        header h1 { font-size: 2.5rem; text-transform: uppercase; letter-spacing: 2px; }
        header p { color: var(--muted); margin-top: 10px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; max-width: 1200px; margin: 0 auto; }
        .card { background: var(--card); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 8px 24px rgba(0,0,0,0.3); border-bottom: 3px solid transparent; transition: transform 0.3s, border-color 0.3s; }
        .card:hover { transform: translateY(-5px); border-color: var(--accent); }
        .video-box { position: relative; width: 100%; padding-top: 56.25%; background: #000; }
        .video-box iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
        .badge { position: absolute; top: 10px; left: 10px; background: var(--accent); color: white; padding: 5px 10px; font-size: 0.75rem; font-weight: bold; border-radius: 4px; text-transform: uppercase; z-index: 10; }
        .content { padding: 15px; display: flex; flex-direction: column; flex-grow: 1; text-align: center; }
        h3 { font-size: 1.1rem; font-weight: 600; color: var(--text); margin-top: 5px; }
    </style>
</head>
<body>

<header>
    <h1>CANLI <span style="color:var(--accent)">MOTOR SPORLARI</span> MERKEZİ</h1>
    <p>MotoGP ve WorldSBK Kanallarından En Güncel İçerikler</p>
</header>

<div class="grid" id="video-grid">
    </div>

<script>
    // Kanalların en güncel içeriklerini liste halinde doğrudan embed olarak basıyoruz.
    // Bu yöntem tarayıcı güvenliğine (CORS) takılmaz, API anahtarı istemez, kota harcamaz!
    const FEEDS = [
        { ch: 'MotoGP', url: 'https://www.youtube.com/embed?listType=user_uploads&list=UC8p_Liq3L3PIeFC0EsZgx-Q' },
        { ch: 'WorldSBK', url: 'https://www.youtube.com/embed?listType=user_uploads&list=UCIdp2N87ZatLh_g_G9Yv96A' }
    ];

    function loadPlayers() {
        const grid = document.getElementById('video-grid');
        grid.innerHTML = ''; // Grid'i temizle

        FEEDS.forEach(feed => {
            const cardHtml = `
                <div class="card">
                    <div class="video-box">
                        <span class="badge">${feed.ch} Canlı / Güncel</span>
                        <iframe 
                            src="${feed.url}" 
                            title="${feed.ch} Video Player" 
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                            allowfullscreen>
                        </iframe>
                    </div>
                    <div class="content">
                        <h3>Resmi En Yeni Videolar</h3>
                    </div>
                </div>
            `;
            grid.innerHTML += cardHtml;
        });
    }

    // Sayfa açıldığında motoru çalıştır
    document.addEventListener('DOMContentLoaded', loadPlayers);
</script>
</body>
</html>
