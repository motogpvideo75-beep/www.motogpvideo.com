<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N-Sport Live | Canlı Yayın Merkezi</title>
    <!-- Video oynatıcı için gerekli modern kütüphane (Plyr) -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0d0e12;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background-color: #161822;
            padding: 15px 20px;
            text-align: center;
            border-bottom: 2px solid #e50914;
        }
        header h1 {
            font-size: 24px;
            color: #e50914;
            letter-spacing: 1px;
        }
        .main-container {
            display: flex;
            flex: 1;
            padding: 20px;
            gap: 20px;
        }
        .player-section {
            flex: 3;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .channel-section {
            flex: 1;
            background-color: #161822;
            border-radius: 8px;
            padding: 15px;
            max-height: 70vh;
            overflow-y: auto;
        }
        .channel-section h3 {
            margin-bottom: 15px;
            font-size: 18px;
            border-bottom: 1px solid #2d3142;
            padding-bottom: 5px;
        }
        .channel-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .channel-item {
            background-color: #232635;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            border-left: 4px solid transparent;
        }
        .channel-item:hover, .channel-item.active {
            background-color: #2d3142;
            border-left-color: #e50914;
        }
        /* Mobil Uyum Düzenlemeleri */
        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
            }
            .channel-section {
                max-height: none;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>N-SPORT LIVE</h1>
    </header>

    <div class="main-container">
        <!-- OYNATICI ALANI -->
        <div class="player-section">
            <video id="player" playsinline controls></video>
            <h2 id="current-channel-title">Kanal Seçiniz</h2>
        </div>

        <!-- KANAL LİSTESİ ALANI -->
        <div class="channel-section">
            <h3>SPOR KANALLARI</h3>
            <div class="channel-list">
                <!-- Buradaki linkler tamamen yasal, dünya çapında açık kaynaklı test yayınlarıdır -->
                <div class="channel-item active" onclick="changeChannel('Kanal 1: Dünya Doğa ve Spor Yayını', 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8')">
                    🎥 Kanal 1: Doğa & Aksiyon Sporları
                </div>
                <div class="channel-item" onclick="changeChannel('Kanal 2: Test Canlı Yayın Akışı', 'https://diceyk67mswt7.cloudfront.net/iso2/index.m3u8')">
                    🏁 Kanal 2: Motor Sporları Test
                </div>
                <div class="channel-item" onclick="changeChannel('Kanal 3: Uzay ve Bilim Canlı', 'https://nasa-i.akamaihd.net/hls/live/253565/NASA-NTV1-Public/master.m3u8')">
                    🚀 Kanal 3: NASA TV (Yasal Canlı)
                </div>
            </div>
        </div>
    </div>

    <!-- HLS (Canlı Yayın Akış) Teknolojisi ve Player için Scriptler -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
    <script>
        const video = document.getElementById('player');
        const channelTitle = document.getElementById('current-channel-title');
        let player;

        // Oynatıcıyı başlat
        document.addEventListener('DOMContentLoaded', () => {
            player = new Plyr(video);
            // İlk kanalı otomatik aç
            changeChannel('Kanal 1: Dünya Doğa ve Spor Yayını', 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8');
        });

        // Kanal Değiştirme Fonksiyonu
        function changeChannel(title, streamUrl) {
            channelTitle.innerText = title;
           
            // Aktif kanal butonunun stilini güncelle
            const items = document.querySelectorAll('.channel-item');
            items.forEach(item => item.classList.remove('active'));
            event.currentTarget.classList.add('active');

            if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(streamUrl);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play();
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = streamUrl;
                video.addEventListener('loadedmetadata', function() {
                    video.play();
                });
            }
        }
    </script>
</body>
</html>
