<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motor Sporları Canlı Merkezi</title>
    <style>
        :root { --bg: #0a0f18; --card: #141f32; --accent: #ff2a4b; --text: #ffffff; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; padding: 20px; }
        header { text-align: center; margin-bottom: 30px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .card { background: var(--card); border-radius: 10px; overflow: hidden; transition: 0.3s; border-bottom: 3px solid transparent; }
        .card:hover { transform: translateY(-5px); border-color: var(--accent); }
        .thumb { width: 100%; aspect-ratio: 16/9; object-fit: cover; }
        .p-3 { padding: 15px; }
        .badge { background: var(--accent); font-size: 10px; padding: 3px 8px; border-radius: 3px; text-transform: uppercase; }
        h3 { font-size: 1rem; margin: 10px 0; height: 2.4em; overflow: hidden; }
        .btn { display: block; text-align: center; background: var(--accent); color: #fff; text-decoration: none; padding: 10px; border-radius: 5px; font-weight: bold; }
        .loading { grid-column: 1/-1; text-align: center; padding: 50px; opacity: 0.7; }
    </style>
</head>
<body>

<header>
    <h1>CANLI <span style="color:var(--accent)">MOTOR SPORLARI</span> MERKEZİ</h1>
    <p>MotoGP ve WorldSBK Resmi Kanallarından Canlı Veriler</p>
</header>

<div class="grid" id="video-grid">
    <div class="loading">Sinyal alınıyor, motorlar ısınıyor...</div>
</div>

<script>
    const CHANNELS = [
        { name: 'MotoGP', id: 'UC8p_Liq3L3PIeFC0EsZgx-Q' },
        { name: 'WorldSBK', id: 'UCIdp2N87ZatLh_g_G9Yv96A' }
    ];

    async function loadContent() {
        const grid = document.getElementById('video-grid');
        let videos = [];

        for (const ch of CHANNELS) {
            try {
                // CORS engelini aşmak için proxy kullanıyoruz
                const rssUrl = `https://www.youtube.com/feeds/videos.xml?channel_id=${ch.id}`;
                const resp = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`);
                const data = await resp.json();
                
                if(data.items) {
                    data.items.forEach(item => {
                        videos.push({
                            title: item.title,
                            link: item.link,
                            img: item.thumbnail,
                            ch: ch.name,
                            date: new Date(item.pubDate)
                        });
                    });
                }
            } catch (e) { console.error("Kanal yüklenemedi:", ch.name); }
        }

        videos.sort((a, b) => b.date - a.date);
        grid.innerHTML = videos.map(v => `
            <div class="card">
                <img src="${v.img}" class="thumb">
                <div class="p-3">
                    <span class="badge">${v.ch}</span>
                    <h3>${v.title}</h3>
                    <a href="${v.link}" target="_blank" class="btn">İzle</a>
                </div>
            </div>
        `).join('');
    }

    loadContent();
</script>
</body>
</html>
