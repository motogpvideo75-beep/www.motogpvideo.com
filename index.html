<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Motor Sporları Canlı Merkezi</title>
    <style>
        :root { --bg: #0a0f18; --card: #141f32; --accent: #ff2a4b; --text: #ffffff; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; text-align: center; padding: 20px; }
        .lang-switch { margin-bottom: 20px; cursor: pointer; color: var(--accent); font-weight: bold; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; max-width: 1100px; margin: 0 auto; }
        .card { background: var(--card); padding: 15px; border-radius: 10px; text-decoration: none; color: white; border: 1px solid #2a3a5a; }
        .btn-small { background: var(--accent); padding: 8px; border-radius: 5px; margin-top: 10px; font-weight: bold; font-size: 0.8rem; }
    </style>
</head>
<body>
    <div class="lang-switch" onclick="toggleLang()">TR / EN</div>
    <h1 id="title">MOTOR SPORLARI MERKEZİ</h1>
    <div class="grid">
        <a href="https://www.youtube.com/@motogp/streams" class="card"><h3>MotoGP</h3><div class="btn-small">CANLI</div></a>
        <a href="https://www.youtube.com/@worldsbk/streams" class="card"><h3>WorldSBK</h3><div class="btn-small">CANLI</div></a>
        <a href="https://www.youtube.com/channel/UCgBitIgXgWi6R9EgAh_vIFw/videos" class="card"><h3>Formula 1</h3><div class="btn-small">CANLI</div></a>
        <a href="https://www.redbull.com/tr-tr/live" class="card"><h3>Red Bull TV</h3><div class="btn-small">CANLI</div></a>
        <a href="https://www.eurosport.com/motorsport/" class="card"><h3>Eurosport</h3><div class="btn-small">YAYINLAR</div></a>
        <a href="https://www.ssportplus.com/canli-yayin" class="card"><h3>S Sport</h3><div class="btn-small">İZLE</div></a>
        <a href="https://www.tntsports.co.uk/" class="card"><h3>TNT Sports</h3><div class="btn-small">İZLE</div></a>
        <a href="https://www.motorsport.tv/" class="card"><h3>Motorsport.tv</h3><div class="btn-small">CANLI</div></a>
        <a href="https://www.twitch.tv/directory/category/racing" class="card"><h3>Twitch Racing</h3><div class="btn-small">İNCELE</div></a>
    </div>

    <script>
        const tr = { 'title': 'MOTOR SPORLARI MERKEZİ' };
        const en = { 'title': 'MOTORSPORTS LIVE HUB' };
        function toggleLang() {
            const lang = document.documentElement.lang === 'tr' ? 'en' : 'tr';
            document.documentElement.lang = lang;
            document.getElementById('title').innerText = (lang === 'tr' ? tr : en)['title'];
        }
    </script>
</body>
</html>
