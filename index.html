<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motor Sporları Merkezi</title>
    <style>
        :root { --bg: #0a0f18; --card: #141f32; --accent: #ff2a4b; --text: #ffffff; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; text-align: center; padding: 20px; }
        .hero { margin: 40px 0; }
        h1 { font-size: 2.5rem; text-transform: uppercase; letter-spacing: 3px; }
        span { color: var(--accent); }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; max-width: 1000px; margin: 0 auto; }
        .card { background: var(--card); padding: 20px; border-radius: 15px; border: 1px solid #2a3a5a; text-decoration: none; color: white; transition: 0.3s; }
        .card:hover { border-color: var(--accent); transform: translateY(-5px); }
        .btn { display: inline-block; background: var(--accent); padding: 10px 20px; border-radius: 50px; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

<div class="hero">
    <h1>MOTOR SPORLARI <span>CANLI MERKEZİ</span></h1>
    <p>En hızlı içerikler ve resmi yayınlar için tek nokta.</p>
</div>

<div class="grid">
    <a href="https://www.youtube.com/@motogp/streams" target="_blank" class="card">
        <h3>🏁 MotoGP</h3>
        <p>Resmi Canlı Yayınlar</p>
        <div class="btn">GİT</div>
    </a>
    <a href="https://www.youtube.com/@worldsbk/streams" target="_blank" class="card">
        <h3>🏍️ WorldSBK</h3>
        <p>Pist ve Padok</p>
        <div class="btn">GİT</div>
    </a>
    <a href="https://www.youtube.com/channel/UCgBitIgXgWi6R9EgAh_vIFw/videos" target="_blank" class="card">
        <h3>🏎️ Formula 1</h3>
        <p>Resmi Kanal</p>
        <div class="btn">GİT</div>
    </a>
    <a href="https://www.motogp.com" target="_blank" class="card">
        <h3>🌐 Canlı Skor</h3>
        <p>Resmi Zamanlama</p>
        <div class="btn">GİT</div>
    </a>
</div>

<footer style="margin-top: 50px; color: #555;">
    <p>© 2026 MotoGP Video Hub - Güncel ve Hızlı</p>
</footer>

</body>
</html>
