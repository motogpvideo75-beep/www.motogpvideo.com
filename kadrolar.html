<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MotoGP 2026 Pilot Kadroları – Sürücüler ve Takımlar | motogpvideo.com</title>
<meta name="description" content="MotoGP 2026 pilot kadroları, tüm sürücüler ve takımlar. Marc Marquez, Pecco Bagnaia, Jorge Martin hangi takımda? 2026 MotoGP kadrosu.">
<meta name="keywords" content="MotoGP 2026 kadro, MotoGP pilotlar, MotoGP takımlar, MotoGP sürücüler 2026, Marquez Bagnaia Martin">
<link rel="icon" href="favicon.ico">
<style>
:root{--bg:#0d1220;--card:#131d30;--card2:#192438;--accent:#e8001d;--border:#1e2d4a;--text:#fff;--muted:#7a90b8;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:"Segoe UI",Arial,sans-serif;min-height:100vh;}
.topbar{background:#080e1a;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--accent);}
.topbar a{color:#fff;text-decoration:none;font-weight:700;font-size:1.1rem;}
.topbar nav a{margin-left:18px;color:var(--muted);font-size:.9rem;text-decoration:none;}
.topbar nav a:hover{color:#fff;}
.hero{background:linear-gradient(135deg,#0d1220 0%,#1a0005 100%);padding:40px 20px;text-align:center;border-bottom:1px solid var(--border);}
.hero h1{font-size:2rem;font-weight:800;margin-bottom:8px;}
.hero h1 span{color:var(--accent);}
.hero p{color:var(--muted);}
.container{max-width:1000px;margin:0 auto;padding:30px 16px;}
.search-bar{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 16px;display:flex;align-items:center;gap:10px;margin-bottom:24px;}
.search-bar input{background:none;border:none;color:#fff;font-size:1rem;flex:1;outline:none;}
.search-bar input::placeholder{color:var(--muted);}
.filter-row{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap;}
.filter-btn{background:var(--card);border:1px solid var(--border);color:var(--muted);padding:7px 16px;border-radius:20px;cursor:pointer;font-size:.85rem;transition:all .2s;}
.filter-btn.active,.filter-btn:hover{background:var(--accent);border-color:var(--accent);color:#fff;}
.team-section{margin-bottom:28px;}
.team-header{background:var(--card2);border:1px solid var(--border);border-radius:12px 12px 0 0;padding:16px 20px;display:flex;align-items:center;gap:12px;border-bottom:2px solid var(--accent);}
.team-color{width:6px;height:40px;border-radius:3px;flex-shrink:0;}
.team-name{font-weight:800;font-size:1.05rem;}
.team-bike{color:var(--muted);font-size:.85rem;}
.riders-grid{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--border);border-top:none;border-radius:0 0 12px 12px;overflow:hidden;}
.rider-card{background:var(--card);padding:16px 20px;display:flex;align-items:center;gap:14px;border-right:1px solid var(--border);}
.rider-card:nth-child(even){border-right:none;}
.rider-card:nth-last-child(-n+2){border-bottom:none;}
.rider-number{font-size:2rem;font-weight:900;color:var(--accent);line-height:1;min-width:50px;}
.rider-name{font-weight:700;font-size:.95rem;}
.rider-nat{color:var(--muted);font-size:.85rem;margin-top:2px;}
.rider-champ{font-size:.75rem;color:#ffd700;margin-top:3px;}
.no-results{text-align:center;padding:60px;color:var(--muted);}
.loading{text-align:center;padding:60px;color:var(--muted);}
.loading .spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px;}
@keyframes spin{to{transform:rotate(360deg)}}
footer{text-align:center;padding:30px;color:var(--muted);font-size:.8rem;border-top:1px solid var(--border);margin-top:40px;}
footer a{color:var(--accent);text-decoration:none;}
@media(max-width:600px){.riders-grid{grid-template-columns:1fr;}.rider-card{border-right:none!important;border-bottom:1px solid var(--border);}}
</style>
</head>
<body>
<div class="topbar">
  <a href="/">🏍️ MotoGP Video</a>
  <nav>
    <a href="/">Ana Sayfa</a>
    <a href="takvim.html">Takvim</a>
    <a href="puan-durumu.html">Puan Durumu</a>
    <a href="canli-yayin.html">Canlı Yayın</a>
    <a href="kadrolar.html">Kadrolar</a>
  </nav>
</div>

<div class="hero">
  <h1>MotoGP 2026 <span>Pilot Kadroları</span></h1>
  <p>Tüm takımlar ve pilotlar – 2026 MotoGP Dünya Şampiyonası</p>
</div>

<div class="container">
  <div class="search-bar">
    <span style="color:var(--muted)">🔍</span>
    <input type="text" id="search" placeholder="Pilot veya takım ara..." oninput="filterRiders()">
  </div>

  <div class="filter-row">
    <button class="filter-btn active" onclick="filterBike('all',this)">Tümü</button>
    <button class="filter-btn" onclick="filterBike('Ducati',this)">🔴 Ducati</button>
    <button class="filter-btn" onclick="filterBike('Yamaha',this)">🔵 Yamaha</button>
    <button class="filter-btn" onclick="filterBike('KTM',this)">🟠 KTM</button>
    <button class="filter-btn" onclick="filterBike('Honda',this)">🔴 Honda</button>
    <button class="filter-btn" onclick="filterBike('Aprilia',this)">⚫ Aprilia</button>
  </div>

  <div id="teams-container">
    <div class="loading"><div class="spinner"></div>Kadrolar yükleniyor...</div>
  </div>
</div>

<footer>
  <p>© 2026 <a href="/">motogpvideo.com</a> · MotoGP 2026 resmi kadro bilgileri</p>
</footer>

<script>
const TEAMS = [
  {
    name:"Ducati Lenovo Team", bike:"Ducati", color:"#e8001d",
    riders:[
      {num:1,name:"Francesco Bagnaia",nat:"🇮🇹 İtalyan",champ:"2022 & 2023 MotoGP Şampiyonu"},
      {num:93,name:"Marc Marquez",nat:"🇪🇸 İspanyol",champ:"8x Dünya Şampiyonu"},
    ]
  },
  {
    name:"Prima Pramac Racing", bike:"Ducati", color:"#e8001d",
    riders:[
      {num:89,name:"Jorge Martin",nat:"🇪🇸 İspanyol",champ:"2024 MotoGP Şampiyonu"},
      {num:49,name:"Fabio Di Giannantonio",nat:"🇮🇹 İtalyan",champ:""},
    ]
  },
  {
    name:"Gresini Racing MotoGP", bike:"Ducati", color:"#e8001d",
    riders:[
      {num:73,name:"Alex Marquez",nat:"🇪🇸 İspanyol",champ:""},
      {num:5,name:"Johann Zarco",nat:"🇫🇷 Fransız",champ:""},
    ]
  },
  {
    name:"Mooney VR46 Racing Team", bike:"Ducati", color:"#ffcc00",
    riders:[
      {num:72,name:"Marco Bezzecchi",nat:"🇮🇹 İtalyan",champ:""},
      {num:10,name:"Luca Marini",nat:"🇮🇹 İtalyan",champ:""},
    ]
  },
  {
    name:"Monster Energy Yamaha", bike:"Yamaha", color:"#0099ff",
    riders:[
      {num:20,name:"Fabio Quartararo",nat:"🇫🇷 Fransız",champ:"2021 MotoGP Şampiyonu"},
      {num:23,name:"Enea Bastianini",nat:"🇮🇹 İtalyan",champ:""},
    ]
  },
  {
    name:"Aprilia Racing", bike:"Aprilia", color:"#333333",
    riders:[
      {num:41,name:"Aleix Espargaro",nat:"🇪🇸 İspanyol",champ:""},
      {num:12,name:"Maverick Viñales",nat:"🇪🇸 İspanyol",champ:""},
    ]
  },
  {
    name:"Red Bull KTM Factory Racing", bike:"KTM", color:"#ff6600",
    riders:[
      {num:33,name:"Brad Binder",nat:"🇿🇦 Güney Afrikalı",champ:""},
      {num:88,name:"Jack Miller",nat:"🇦🇺 Avustralyalı",champ:""},
    ]
  },
  {
    name:"Tech3 GASGAS Factory Racing", bike:"KTM", color:"#ff0000",
    riders:[
      {num:37,name:"Augusto Fernandez",nat:"🇪🇸 İspanyol",champ:""},
      {num:25,name:"Raul Fernandez",nat:"🇪🇸 İspanyol",champ:""},
    ]
  },
  {
    name:"Repsol Honda Team", bike:"Honda", color:"#cc0000",
    riders:[
      {num:36,name:"Joan Mir",nat:"🇪🇸 İspanyol",champ:"2020 MotoGP Şampiyonu"},
      {num:30,name:"Takaaki Nakagami",nat:"🇯🇵 Japon",champ:""},
    ]
  },
  {
    name:"LCR Honda", bike:"Honda", color:"#cc0000",
    riders:[
      {num:43,name:"Alex Rins",nat:"🇪🇸 İspanyol",champ:""},
      {num:55,name:"Tetsuta Nagashima",nat:"🇯🇵 Japon",champ:""},
    ]
  },
];

let currentBikeFilter = 'all';

function filterBike(bike, btn) {
  currentBikeFilter = bike;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderTeams();
}

function filterRiders() {
  renderTeams();
}

function renderTeams() {
  const query = document.getElementById('search').value.toLowerCase();
  const container = document.getElementById('teams-container');
  let html = '';
  let found = false;

  TEAMS.forEach(team => {
    if (currentBikeFilter !== 'all' && team.bike !== currentBikeFilter) return;

    const matchingRiders = team.riders.filter(r =>
      query === '' ||
      r.name.toLowerCase().includes(query) ||
      team.name.toLowerCase().includes(query) ||
      team.bike.toLowerCase().includes(query)
    );

    if (matchingRiders.length === 0 && query !== '') return;
    found = true;

    html += `
    <div class="team-section">
      <div class="team-header">
        <div class="team-color" style="background:${team.color}"></div>
        <div>
          <div class="team-name">${team.name}</div>
          <div class="team-bike">Motor: ${team.bike}</div>
        </div>
      </div>
      <div class="riders-grid">
        ${(matchingRiders.length ? matchingRiders : team.riders).map(r=>`
        <div class="rider-card">
          <div class="rider-number">#${r.num}</div>
          <div>
            <div class="rider-name">${r.name}</div>
            <div class="rider-nat">${r.nat}</div>
            ${r.champ?`<div class="rider-champ">⭐ ${r.champ}</div>`:''}
          </div>
        </div>`).join('')}
      </div>
    </div>`;
  });

  container.innerHTML = found ? html : '<div class="no-results">🔍 Sonuç bulunamadı.</div>';
}

renderTeams();
</script>
</body>
</html>
